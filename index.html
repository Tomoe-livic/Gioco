<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuestHabit</title>
    <link rel="stylesheet" href="styles.css">
    <!--FONT MODERN ANTIQUA -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Modern+Antiqua&display=swap" rel="stylesheet">
    <script src="index.js" defer></script>
</head>
<body>
    <header id="incipit">
    <h2>Salve, viandante</h2>
    <p>I miei poveri vecchi occhi stanchi non riescono a vederti, parlami un po' di te.</p>
    <form id="creazione-personaggio">
        Chi sei?
        <input id="nome-giocatore" required type="text">
        <button type="submit">Avanti</button>
    </form>
    
    <div id="scelta2" hidden>
    <p>Qual è la tua classe?</p>
<!-- Aggiungere delle immagini relative a ogni classe-->
 <!-- Sarebbe carino se riuscissi a usare slide per far scegliere la classe-->
    <div id="scelta-classe">
        <button data-classe="GUERRIERO">Guerriero</button>
        <button data-classe="MAGO">Mago</button>
        <button data-classe="CHIERICO">Chierico</button>
        <button data-classe="BARDO">Bardo</button>
        <button data-classe="LADRO">Ladro</button>
        <button data-classe="BARBARO">Barbaro</button>
    </div>
    </div>
    </header>

<main id="home" hidden>
    <section id="pagina-quest">

        <div id="riga-stat-hp">
            <div id="stat-riassunto"></div>
        
            <div id="barre-vitali">
                <div class="barra-contenitore">
                   <div id="barra-hp" class="barra-riempimento"></div>
                </div>
                <div class="barra-contenitore">
                    <div id="barra-mp" class="barra-riempimento"></div>
                </div>
            </div>
        </div>

        <div id="banner-benvenuto"></div>
        <div id="creazione-task">
            <input type="text" name="nuova-task" id="nuova-task" placeholder="Aggiungi Nuova Quest">

            <select id="statistica-task">
                <option value="forza">Forza</option>
                <option value="saggezza">Saggezza</option>
                <option value="intelletto">Intelletto</option>
                <option value="carisma">Carisma</option>
                <option value="destrezza">Destrezza</option>
                <option value="costituzione">Costituzione</option>
            </select>

            <button id="aggiungi-task">Aggiungi</button>
        </div>
        <div id="lista-task"></div>
    </section>

    <section id="pagina-statistiche" hidden>

        <div id="stat-base"></div>

        <div id="barre-essenza">

            <div class="gruppo-barra">
                <p>HP: </p>
                <div class="barra-contenitore">
                    <div id="barra-health" class="barra-riempimento"></div>
                    <span id="valore-hp" class="valore-barra"></span>
                </div>
            </div>

            <div class="gruppo-barra">
                <p>MP: </p>
                <div class="barra-contenitore">
                    <div id="barra-mana" class="barra-riempimento"></div>
                    <span id="valore-mp" class="valore-barra"></span>
                </div>
            </div>

        </div>

        <div id="stat-tutte"></div>

    </section>

    <section id="pagina-campagna" hidden>
        <div id="mappa-container"></div>
        <div id="dialogo-campagna"></div>
    </section>

    <nav id="tab-bar">
        <button data-pagina="pagina-campagna">Campagna</button>
        <button data-pagina="pagina-quest">Quest</button>
        <button data-pagina="pagina-statistiche">Statistiche</button>
    </nav>
</main>

</body>
</html>
